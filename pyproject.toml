[project]
name = "vulntriage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2", "langchain-openai>=0.2", "pydantic>=2", "httpx>=0.27", "python-dotenv>=1", "streamlit>=1.38", "typer>=0.12"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
vulntriage = "vulntriage.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/vulntriage"]

[tool.ruff]
line-length = 160
[tool.ruff.lint]
select = ["E", "F", "I"]
